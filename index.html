<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">
<script src="js/script.js" type="module" defer></script>

    <title>Coleta de Resíduos</title>
</head>
<body>

    <div id="geral">

            <h2>Coleta de Resíduo</h2>

        <form id="form-coleta">

               

             <label for="nome">EMPRESA</label>
            <input type="text" name="nome" id="nome">

            <label for="descricao">DESCREVA SUA EMPRESA</label>
            <input type="text" name="descricao" id="descricao">

             <label for="residuo">TOTAL DE RESIDUOS COLETADOS</label>
            <input type="text" name="residuo" id="residuo" placeholder="TONELADAS">

             <button type="submit" id="btn-add">Adicionar</button>
               <button type="reset" id="btn-limpar">Limpar</button>

        </form>

        <div id="div-result"></div>

    </div>
    
</body>
</html>
